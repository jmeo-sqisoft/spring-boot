spring:
  config:
    activate:
      on-profile: perf

app:
  sql-logging:
    enabled: false

logging:
  level:
    com.stagora: debug
    org.hibernate.SQL: "OFF"
    org.hibernate.orm.jdbc.bind: "OFF"
    com.stagora.report.sample.mapper: info
    p6spy: info

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
