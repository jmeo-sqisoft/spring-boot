spring:
  application:
    name: spring-boot
  jpa:
    open-in-view: false
    generate-ddl: false
    show-sql: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  datasource:
    # Keep the reference project's datasource namespace; both JPA and MyBatis use it.
    local:
      driver-class-name: org.postgresql.Driver
      url: jdbc:postgresql://${DB-READ-HOST}/stastics
      username: ${DB-USERNAME}
      password: ${DB-PASSWORD}
      hikari:
        pool-name: gmcs-be-hikari-pool
        maximum-pool-size: ${BE_DB_READ_MAX_POOL_SIZE:${BE_DB_MAX_POOL_SIZE:10}}
        minimum-idle: ${BE_DB_READ_MIN_IDLE:${BE_DB_MIN_IDLE:2}}
        connection-timeout: ${BE_DB_READ_CONN_TIMEOUT:${BE_DB_CONN_TIMEOUT:30000}}
        idle-timeout: ${BE_DB_READ_IDLE_TIMEOUT:${BE_DB_IDLE_TIMEOUT:600000}}
        max-lifetime: ${BE_DB_READ_MAX_LIFETIME:${BE_DB_MAX_LIFETIME:1800000}}
        validation-timeout: ${BE_DB_READ_VALID_TIMEOUT:${BE_DB_VALID_TIMEOUT:5000}}
        connection-init-sql: "SET timezone = 'UTC'; SET default_transaction_read_only = on"
        data-source-properties:
          '[ApplicationName]': gmcs
          '[currentSchema]': public,sta_sqi

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.seegene.local
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

app:
  sql-logging:
    enabled: true

logging:
  level:
    com.seegene.local: debug
    org.hibernate.SQL: "OFF"
    org.hibernate.orm.jdbc.bind: "OFF"
    p6spy: info

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: ${BE_HEALTH_DETAILS:when_authorized}
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState
        liveness:
          include: livenessState

springdoc:
  api-docs:
    path: /local-api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

server:
  port: ${SERVER_PORT:8080}
